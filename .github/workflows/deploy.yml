name: Deploy production

# Pull requests run tests only. Pushes to main deploy every change since the
# last verified production deployment. See docs/deployment-runbook.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_full:
        description: Full deployment of the selected main commit (bootstrap or recovery)
        type: boolean
        default: true

# One production run at a time, including classification. Pull request tests
# use their own group so they do not wait for a production deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'production-deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go vet and tests
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Deployment script tests
        run: |
          ./scripts/classify-deploy_test.sh
          ./scripts/ci-deploy_test.sh
          ./scripts/remote-deploy_test.sh
          ./scripts/ci-deploy.sh validate
      - name: Compose renders with a pinned image
        run: |
          ADMIN_TOKEN=ci GRAFANA_ADMIN_PASSWORD=ci \
            ZIBS_IMAGE="ghcr.io/example/zibs@sha256:$(printf '0%.0s' {1..64})" \
            docker compose --env-file /dev/null --profile production config --quiet

  plan:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install deployment SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$RUNNER_TEMP/known_hosts"
      - name: Classify changes since the last verified deployment
        id: classify
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full && 'full' || '' }}
        run: |
          mode=$(DEPLOY_SSH_KEY_FILE="$RUNNER_TEMP/deploy_key" \
            DEPLOY_KNOWN_HOSTS_FILE="$RUNNER_TEMP/known_hosts" \
            ./scripts/ci-deploy.sh plan "$GITHUB_SHA" $FORCE)
          printf 'mode=%s\n' "$mode" >>"$GITHUB_OUTPUT"
          printf 'Deployment mode for `%s`: **%s**\n' "$GITHUB_SHA" "$mode" >>"$GITHUB_STEP_SUMMARY"

  image:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push the image
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zibs"
          printf '%s\n' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$repository:$GITHUB_SHA" .
          docker push --quiet "$repository:$GITHUB_SHA"
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$repository:$GITHUB_SHA")
          [[ $image =~ ^${repository//./\\.}@sha256:[0-9a-f]{64}$ ]] || { echo "Unexpected digest: $image" >&2; exit 1; }
          docker logout ghcr.io
          printf 'image=%s\n' "$image" >>"$GITHUB_OUTPUT"
          printf 'Published `%s`\n' "$image" >>"$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [plan, image]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'none'
      && (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install deployment SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$RUNNER_TEMP/known_hosts"
      - name: Deploy
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          IMAGE: ${{ needs.image.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export ZIBS_IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zibs"
          DEPLOY_SSH_KEY_FILE="$RUNNER_TEMP/deploy_key" \
            DEPLOY_KNOWN_HOSTS_FILE="$RUNNER_TEMP/known_hosts" \
            ./scripts/ci-deploy.sh deploy "$MODE" "$GITHUB_SHA" $IMAGE
          printf 'Deployed `%s` in **%s** mode%s\n' "$GITHUB_SHA" "$MODE" "${IMAGE:+ with \`$IMAGE\`}" >>"$GITHUB_STEP_SUMMARY"
